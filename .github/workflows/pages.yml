# Builds the public site and deploys it to GitHub Pages:
#   /                      the lab page (scripts/build-lab-page.py)
#   /gravity-from-touch/   the Gravity from Touch workbench (static build with replay of development items)
#   /shutdown-after-the-task/  Shutdown After the Task: report mirror (DOI banner) and replay (scripts/build-site-shutdown-after-the-task.py; committed files only)
# Skipped while the repository is private. The bench must pass its own checks before it is published.
name: Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: embodiment/gravity-from-touch/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Gravity from Touch — verify and build the workbench
        working-directory: embodiment/gravity-from-touch
        run: |
          npm ci
          npm run verify
          npm run build:demo
      - name: Shutdown After the Task — report mirror and replay
        run: python scripts/build-site-shutdown-after-the-task.py
      - name: Lab page
        run: |
          python scripts/build-lab-page.py --check
          python scripts/build-lab-page.py
      - name: Link check (every Markdown link and the built lab page; fetches external URLs)
        run: python scripts/check-links.py --external
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp dist/lab/index.html _site/index.html
          cp -r embodiment/gravity-from-touch/dist _site/gravity-from-touch
          cp -r dist/shutdown-after-the-task _site/shutdown-after-the-task
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
